
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabu - Microsoft Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <div class="background">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    
    <div class="container">
        <div class="login-card">
            <div class="logo-container">
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fa-solid fa-sparkles"></i>
                    </div>
                </div>
            </div>
            
            <h1>Welcome to Cabu</h1>
            <p>Sign in with your Microsoft account to continue</p>
            
            <div class="login-button-container">
                <button id="microsoft-login-btn" class="microsoft-login-btn">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/44/Microsoft_logo.svg/512px-Microsoft_logo.svg.png" alt="Microsoft Logo">
                    <a href="dashboard.html"><span>Sign in with Microsoft</span></a>
                </button>
            </div>
            
            <div class="footer">
                <p class="footer-text">Don't have an account? <a href="#">Contact admin</a></p>
                <p class="terms">By signing in, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a></p>
            </div>
        </div>
    </div>
    
    <script src="login.js"></script>
</body>
</html>
